<h2 class="dialog-title head"><app-icon name="event_seat" /> Add seats</h2>
<div class="dialog-content stack">
  <div class="pair">
    <label
      >Rows
      <p-inputnumber
        [ngModel]="rows()"
        (ngModelChange)="rows.set($event ?? 1)"
        [min]="1"
        [max]="200"
        [showButtons]="true"
      />
    </label>
    <label
      >Seats in a row
      <p-inputnumber
        [ngModel]="perRow()"
        (ngModelChange)="perRow.set($event ?? 1)"
        [min]="1"
        [max]="500"
      />
    </label>
    <label
      >Seat width (m)
      <p-inputnumber
        [ngModel]="width()"
        (ngModelChange)="width.set($event ?? 0.5)"
        [min]="0.2"
        [max]="5"
        [maxFractionDigits]="2"
      />
    </label>
    <label
      >Seat depth (m)
      <p-inputnumber
        [ngModel]="depth()"
        (ngModelChange)="depth.set($event ?? 0.5)"
        [min]="0.2"
        [max]="5"
        [maxFractionDigits]="2"
      />
    </label>
    <label
      >Gap between seats (m)
      <p-inputnumber
        [ngModel]="gap()"
        (ngModelChange)="gap.set($event ?? 0)"
        [min]="0"
        [max]="5"
        [maxFractionDigits]="2"
      />
    </label>
    <label
      >Gap between rows (m)
      <p-inputnumber
        [ngModel]="rowGap()"
        (ngModelChange)="rowGap.set($event ?? 0)"
        [min]="0"
        [max]="10"
        [maxFractionDigits]="2"
      />
    </label>
    <label
      >First row
      <p-select
        [options]="firstRows"
        optionLabel="label"
        optionValue="value"
        [ngModel]="firstRow()"
        (ngModelChange)="firstRow.set($event)"
        appendTo="body"
      />
    </label>
    <label
      >Category
      <p-select
        [options]="categories()"
        optionLabel="name"
        optionValue="id"
        [ngModel]="categoryId()"
        (ngModelChange)="categoryId.set($event)"
        [showClear]="true"
        placeholder="None"
        appendTo="body"
      />
    </label>
  </div>
  <div class="preview" aria-hidden="true">
    <div class="seats" [style.grid-template-columns]="'repeat(' + shownPerRow() + ', 14px)'">
      @for (i of shownCells(); track i) {
        <span></span>
      }
    </div>
  </div>
  <p class="summary">
    <b>{{ count() | number }}</b> seats, {{ firstLabel() }} to {{ lastLabel() }} ·
    {{ size().width | number: '1.0-1' }} × {{ size().depth | number: '1.0-1' }} m <br /><span
      class="muted"
      >Placed in the middle of the view — drag it where it goes.</span
    >
  </p>
</div>
<div class="dialog-actions">
  <button pButton [text]="true" type="button" (click)="ref.close()">Cancel</button>
  <button pButton type="button" class="seat-btn" (click)="add()">
    Add {{ count() | number }} seats
  </button>
</div>
