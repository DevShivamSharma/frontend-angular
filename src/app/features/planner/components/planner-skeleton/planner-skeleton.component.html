<div class="shell" aria-hidden="true">
  <div class="ribbon">
    @for (tool of tools; track tool) {
      <p-skeleton width="2.25rem" height="2.25rem" borderRadius="8px" />
    }
    <span class="spacer"></span>
    <p-skeleton width="5rem" height="2.25rem" borderRadius="8px" />
    <p-skeleton width="5.5rem" height="2.25rem" borderRadius="8px" />
  </div>
  <div class="body">
    <aside class="side">
      <p-skeleton width="60%" height="1.1rem" />
      <p-skeleton width="90%" height="0.8rem" />
      <p-skeleton height="5rem" borderRadius="10px" />
      <p-skeleton height="7rem" borderRadius="10px" />
      <p-skeleton height="4rem" borderRadius="10px" />
    </aside>
    <div class="floor">
      <div class="floor__sheet"></div>
      <p class="floor__text">
        <i class="pi pi-spin pi-spinner" aria-hidden="true"></i> Opening the planner…
      </p>
    </div>
    <aside class="side">
      <p-skeleton width="50%" height="1.1rem" />
      <p-skeleton height="6rem" borderRadius="10px" />
      <p-skeleton height="9rem" borderRadius="10px" />
    </aside>
  </div>
</div>
