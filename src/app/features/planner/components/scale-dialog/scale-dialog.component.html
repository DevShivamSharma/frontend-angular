<h2 class="dialog-title head"><app-icon name="scale" /> Scale booths</h2>
<div class="dialog-content stack">
  <label
    >Size (%)
    <p-inputnumber
      [ngModel]="percent()"
      (ngModelChange)="percent.set($event ?? 100)"
      [min]="10"
      [max]="1000"
      [showButtons]="true"
      [step]="10"
      suffix=" %"
    />
  </label>
  <p class="muted small">
    Each of the {{ data.count }} selected booths grows or shrinks about its middle; 100 % keeps it
    as it is.
  </p>
</div>
<div class="dialog-actions">
  <button pButton [text]="true" type="button" (click)="ref.close()">Cancel</button>
  <button pButton type="button" (click)="ref.close(percent() / 100)" [disabled]="percent() === 100">
    Scale
  </button>
</div>
