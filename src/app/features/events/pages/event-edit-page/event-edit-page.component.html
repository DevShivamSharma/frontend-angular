<div class="page">
  <app-page-header
    title="Edit event"
    [subtitle]="known()?.name"
    [backLink]="'/events/' + eventId()"
    backLabel="Event"
  />
  @if (loading()) {
    <p class="text-muted" role="status">
      <i class="pi pi-spin pi-spinner" aria-hidden="true"></i> Loading the event…
    </p>
  } @else if (failed()) {
    <app-empty-state
      icon="pi-exclamation-triangle"
      title="The event could not be loaded"
      message="Check your connection and try again."
    >
      <p-button label="Try again" icon="pi pi-refresh" (onClick)="load()" />
    </app-empty-state>
  } @else {
    <app-event-form
      mode="edit"
      [known]="known()"
      [submitting]="submitting()"
      [failure]="failure()"
      (edited)="save($event)"
      (cancelled)="back()"
    />
  }
</div>
