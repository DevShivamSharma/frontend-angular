<div class="page">
  <app-page-header
    title="Create event"
    subtitle="An internal event ITPO organises itself."
    backLink="/events"
    backLabel="Events"
  />
  <app-event-wizard-dialog
    #wizard
    [organisations]="organisations()"
    [organisationsLoading]="organisationsLoading()"
    [submitting]="submitting()"
    [failure]="failure()"
    (created)="create($event)"
    (cancelled)="cancel()"
  />
</div>
