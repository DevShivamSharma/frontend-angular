@if (steps().length) {
  <section class="progress" aria-label="Progress of this event">
    <ol class="steps">
      @for (step of steps(); track step.id; let i = $index) {
        <li
          class="step"
          [attr.data-state]="step.done ? 'done' : next()?.index === i ? 'now' : null"
          [attr.aria-current]="next()?.index === i ? 'step' : null"
        >
          <span class="mark" aria-hidden="true">
            @if (step.done) {
              <i class="pi pi-check"></i>
            } @else {
              {{ i + 1 }}
            }
          </span>
          <span class="label">
            <b>
              {{ step.label }}
              <span class="visually-hidden">{{ step.done ? ' (done)' : '' }}</span>
            </b>
            @if (step.note) {
              <small>{{ step.note }}</small>
            }
          </span>
        </li>
      }
    </ol>
    @if (next(); as n) {
      @if (canAct()) {
        <p-button
          class="cta"
          [label]="n.step.cta"
          icon="pi pi-arrow-right"
          iconPos="right"
          (onClick)="go()(n.step.tab)"
        />
      }
    } @else {
      <p class="done-all">
        <i class="pi pi-check-circle" aria-hidden="true"></i> Every step is done
      </p>
    }
  </section>
}
