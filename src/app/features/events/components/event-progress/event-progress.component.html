@if (steps().length) {
  <section class="progress" aria-label="Progress of this event">
    <ol class="steps">
      @for (step of steps(); track step.id; let i = $index) {
        <li
          class="step"
          [attr.data-state]="step.done ? 'done' : next()?.index === i ? 'now' : null"
          [attr.aria-current]="next()?.index === i ? 'step' : null"
        >
          <!-- Each step opens the tab where it is done. -->
          <button type="button" class="step-btn" (click)="go()(step.tab)">
            <span class="mark" aria-hidden="true">
              @if (step.done) {
                <i class="pi pi-check"></i>
              } @else {
                {{ i + 1 }}
              }
            </span>
            <span class="label">
              <b>
                {{ step.label }}
                @if (next()?.index === i) {
                  <span class="next-pill">Next</span>
                }
                <span class="visually-hidden">{{ step.done ? ' (done)' : '' }}</span>
              </b>
              @if (step.note) {
                <small>{{ step.note }}</small>
              }
            </span>
          </button>
        </li>
      }
    </ol>
  </section>
}
