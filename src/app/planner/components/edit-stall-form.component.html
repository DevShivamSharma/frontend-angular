@if (selectedStall(); as stall) {
  <section class="card is-selected-card" [formGroup]="form">
    <h3 class="panel-title">
      <app-icon class="icon-slot" name="pencil" />
      Edit Selected Shop
    </h3>
    <div class="panel-hint">Click a shop to select it. Drag it on the grid to move it.</div>

    <input class="control" aria-label="Shop name" formControlName="name" />

    <div class="row">
      <label class="number-field">
        Width
        <input class="control" type="number" formControlName="width" />
      </label>
      <label class="number-field">
        Length
        <input class="control" type="number" formControlName="length" />
      </label>
      <label class="number-field">
        Height
        <input class="control" type="number" formControlName="height" />
      </label>
    </div>

    <span class="field-label" id="edit-stall-gate-label">Open Sides</span>
    <div class="panel-hint">Click to toggle. At least one side stays open.</div>
    <div class="grid-2" role="group" aria-labelledby="edit-stall-gate-label">
      @for (side of gateSides; track side[0]) {
        <button
          type="button"
          class="btn-gate"
          [class.is-selected]="stall.openSides.includes(side[0])"
          [attr.aria-pressed]="stall.openSides.includes(side[0])"
          (click)="toggleGateSide(side[0])"
        >
          <app-icon [name]="side[2]" [size]="14" />
          {{ side[1] }}
        </button>
      }
    </div>

    <div class="row">
      <label class="number-field">
        X (drag)
        <input class="control" type="number" formControlName="posX" />
      </label>
      <label class="number-field">
        Z (drag)
        <input class="control" type="number" formControlName="posZ" />
      </label>
    </div>

    <button type="button" class="btn-primary" (click)="applyChanges()">
      <app-icon name="check" [size]="14" />
      Apply Shop Changes
    </button>
    <button type="button" class="btn-danger" (click)="removeStall()">
      <app-icon name="trash" [size]="14" />
      Remove Shop
    </button>
  </section>
}
