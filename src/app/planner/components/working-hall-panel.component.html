<section class="card">
  <h3 class="panel-title">
    <app-icon class="icon-slot" name="building" />
    Working Hall
  </h3>

  <label class="sr-only" for="working-hall">Working hall</label>
  <select
    id="working-hall"
    class="control"
    [value]="activeHallId()"
    (change)="onHallChange($any($event.target).value)"
  >
    @for (hall of halls(); track hall.id) {
      <option [value]="hall.id" [selected]="isActive(hall.id)">
        {{ hall.name }} [{{ hall.shape }}]
      </option>
    }
  </select>

  <div class="grid-2 gap-7">
    <button type="button" class="btn-secondary" (click)="openFilePicker()">
      <app-icon name="upload" [size]="14" />
      Import Excel
    </button>
    <button type="button" class="btn-secondary" (click)="downloadTemplate()">
      <app-icon name="file" [size]="14" />
      Template
    </button>
  </div>

  <input
    #fileInput
    type="file"
    accept=".xlsx,.xls"
    hidden
    aria-hidden="true"
    tabindex="-1"
    (change)="onFileSelected($event)"
  />
</section>
