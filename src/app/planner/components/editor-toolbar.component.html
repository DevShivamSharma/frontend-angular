<div class="editor-toolbar" role="toolbar" aria-label="Layout editor">
  <!-- Select and Draw are mutually exclusive, so they sit in one track and look it. -->
  <div class="toolbar-group tool-track" role="group" aria-label="Mode">
    <button
      type="button"
      class="tool-btn"
      [class.is-active]="mode() === 'select'"
      [attr.aria-pressed]="mode() === 'select'"
      title="Select and drag shops"
      (click)="setMode('select')"
    >
      <app-icon name="pointer" [size]="14" />
      Select
    </button>
    <button
      type="button"
      class="tool-btn"
      [class.is-active]="mode() === 'draw'"
      [attr.aria-pressed]="mode() === 'draw'"
      title="Drag on the grid to draw a new stall"
      (click)="setMode('draw')"
    >
      <app-icon name="draw" [size]="14" />
      Draw stall
    </button>
  </div>

  <div class="toolbar-group" role="group" aria-label="Stall size">
    <span class="toolbar-label" aria-hidden="true">Size</span>
    <button
      type="button"
      class="tool-btn is-chip"
      [class.is-active]="mode() === 'draw' && selectedStallTypeId() === null"
      [attr.aria-pressed]="mode() === 'draw' && selectedStallTypeId() === null"
      title="Drag any size on the grid"
      (click)="selectType(null)"
    >
      Custom
    </button>
    @for (type of stallTypes(); track type.id) {
      <button
        type="button"
        class="tool-btn is-chip"
        [class.is-active]="mode() === 'draw' && selectedStallTypeId() === type.id"
        [attr.aria-pressed]="mode() === 'draw' && selectedStallTypeId() === type.id"
        [title]="type.width + ' × ' + type.height + ' m — drag sideways or up/down to orient'"
        (click)="selectType(type.id)"
      >
        {{ type.label }}
      </button>
    }
    @if (mode() === 'draw') {
      <label class="tool-select">Open side
        <select class="control" [value]="draftOpenSide()" (change)="setDraftOpenSide($any($event.target).value)">
          <option value="FRONT">Front (+Z)</option><option value="BACK">Back (−Z)</option>
          <option value="LEFT">Left (−X)</option><option value="RIGHT">Right (+X)</option>
        </select>
      </label>
      <button
        type="button"
        class="tool-btn is-cancel"
        title="Stop drawing and go back to Select (Esc)"
        (click)="cancelDraw()"
      >
        <app-icon name="x" [size]="14" />
        Cancel
        <kbd class="tool-kbd" aria-hidden="true">Esc</kbd>
      </button>
    }
  </div>

  @if (ruleDriven()) {
    <div class="toolbar-group rules-view-group" role="group" aria-label="Rules view">
      <label class="tool-select">
        <span class="sr-only">Event type</span>
        <select class="control" [value]="eventType()" (change)="setEventType($any($event.target).value)">
          @for (type of eventTypes; track type) {
            <option [value]="type">{{ passageLabel()(type) }}</option>
          }
        </select>
      </label>
      <label class="tool-select passage-control">Passage (m)
        <input class="control" aria-label="Passage width (m)" type="number" min="1.5" max="5" step="0.5"
          [value]="passageWidth()" (change)="setPassageWidth($any($event.target))" />
      </label>
      <label class="layer-toggle" [class.is-on]="showClearances()">
        <input type="checkbox" [checked]="showClearances()" (change)="toggleClearances($any($event.target).checked)" />
        <span>Clearances</span>
      </label>
      <label class="layer-toggle" [class.is-on]="showLabels()" title="Name and open-side tags on every stall (the selected stall always shows its own)">
        <input type="checkbox" [checked]="showLabels()" (change)="toggleLabels($any($event.target).checked)" />
        <span>Labels</span>
      </label>
      <label class="layer-toggle" [class.is-on]="showFreeSpace()">
        <input type="checkbox" [checked]="showFreeSpace()" (change)="toggleFreeSpace($any($event.target).checked)" />
        <span>Free space for <strong>{{ freeSizeLabel() }}</strong></span>
        @if (freeCount() !== null) {
          <span class="fit-count">{{ freeCount() }} fit</span>
        }
      </label>
    </div>
  }
</div>
