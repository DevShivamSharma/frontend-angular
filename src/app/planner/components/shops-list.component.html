<section class="card">
  <div class="panel-header">
    <h3 class="panel-title">
      <app-icon class="icon-slot" name="store" />
      Shops in Hall ({{ currentStalls().length }})
    </h3>
    <label class="snap-toggle">
      <input
        type="checkbox"
        [checked]="snap()"
        (change)="onSnapChange($any($event.target).checked)"
      />
      Snap 1 unit
    </label>
  </div>

  @for (stall of currentStalls(); track stall.id; let i = $index) {
    <button
      type="button"
      class="stall-row"
      [class.is-selected]="isSelected(stall.id)"
      [attr.aria-pressed]="isSelected(stall.id)"
      (click)="select(stall.id)"
    >
      <span class="stall-row-name">{{ stall.name || 'Shop ' + (i + 1) }}</span>
      <span class="stall-row-meta">
        Open: {{ (stall.openSides.length ? stall.openSides : [stall.gateSide]).join(', ') }} · {{ stall.width }}×{{ stall.length }} · X {{ stall.posX }}, Z
        {{ stall.posZ }}
      </span>
    </button>
  } @empty {
    <div class="empty-state">No shops placed. Add one above.</div>
  }
</section>
