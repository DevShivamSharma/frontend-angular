@if (highlight(); as box) {
  <div class="tour-spotlight" aria-hidden="true"
    [style.left.px]="box.left" [style.top.px]="box.top"
    [style.width.px]="box.width" [style.height.px]="box.height"></div>
}
<section #card class="tour-card" role="dialog" aria-modal="false" lang="en"
  aria-label="Stall Planner guided tour" aria-describedby="tour-message"
  [attr.data-step]="step().id" [class.is-ready]="ready()"
  [style.left.px]="position().left" [style.top.px]="position().top">
  <div aria-live="polite" aria-atomic="true">
    <h2 #heading id="tour-title" tabindex="-1">{{ step().title }}</h2>
    <p id="tour-message">{{ step().message }}</p>
  </div>
  <div class="tour-progress">
    <span>Step {{ index() + 1 }} / {{ total() }}</span>
    <div class="tour-track" role="progressbar" aria-label="Tour progress"
      [attr.aria-valuenow]="index() + 1" aria-valuemin="1" [attr.aria-valuemax]="total()">
      <span [style.width.%]="((index() + 1) / total()) * 100"></span>
    </div>
  </div>
  <footer>
    <button type="button" class="tour-skip" (click)="skip.emit()">Skip</button>
    <div class="tour-navigation">
      <button type="button" class="tour-back" [disabled]="index() === 0" (click)="back.emit()">Back</button>
      @if (index() + 1 === total()) {
        <button type="button" class="tour-next" (click)="finish.emit()">Finish</button>
      } @else {
        <button type="button" class="tour-next" (click)="next.emit()">Next</button>
      }
    </div>
  </footer>
</section>
