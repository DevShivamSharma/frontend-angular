<fieldset class="basic-rules">
  <legend>Basic rules <span>{{ enabledCount() }} / {{ rules.length }} on</span></legend>
  <p class="basic-intro">Choose which placement checks apply. Off rules do not report issues or block saving.</p>
  <div class="basic-actions">
    <button type="button" (click)="setAll(true)" [disabled]="enabledCount() === rules.length">All on</button>
    <button type="button" (click)="setAll(false)" [disabled]="enabledCount() === 0">All off</button>
  </div>
  @for (rule of rules; track rule.id) {
    <label class="basic-rule">
      <span class="basic-copy"><strong>{{ rule.label }}</strong><small>{{ rule.description }}</small></span>
      <span class="basic-control">
        <input type="checkbox" role="switch" [attr.aria-label]="rule.label" [checked]="enabled(rule.id)"
          (change)="toggle(rule.id, $any($event.target).checked)" />
        <span aria-hidden="true">{{ enabled(rule.id) ? 'On' : 'Off' }}</span>
      </span>
    </label>
  }
  <p class="basic-note">Stalls still need valid geometry, positive dimensions and an open side.</p>
</fieldset>
