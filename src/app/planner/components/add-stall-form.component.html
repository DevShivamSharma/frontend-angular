<section class="card" [formGroup]="form">
  <h3 class="panel-title">
    <app-icon class="icon-slot" name="plus" />
    Add Shop
  </h3>

  <input
    class="control"
    placeholder="Shop / Stall Name"
    aria-label="Shop or stall name"
    maxlength="255"
    formControlName="name"
  />

  <div class="row">
    <label class="number-field">
      Width (m)
      <input class="control" type="number" min="0.5" inputmode="decimal" formControlName="width" />
    </label>
    <label class="number-field">
      Length (m)
      <input class="control" type="number" min="0.5" inputmode="decimal" formControlName="length" />
    </label>
    <label class="number-field">
      Height (m)
      <input class="control" type="number" min="0.5" inputmode="decimal" formControlName="height" />
    </label>
  </div>

  <label class="field-label" for="new-stall-color">Color</label>
  <input id="new-stall-color" class="color-input" type="color" formControlName="color" />

  <span class="field-label" id="new-stall-gate-label">Customer Entry / Open Side</span>
  <div class="grid-2" role="group" aria-labelledby="new-stall-gate-label">
    @for (side of gateSides; track side[0]) {
      <button
        type="button"
        class="btn-gate"
        [class.is-selected]="gateSide() === side[0]"
        [attr.aria-pressed]="gateSide() === side[0]"
        (click)="setGateSide(side[0])"
      >
        <app-icon [name]="side[2]" [size]="14" />
        {{ side[1] }}
      </button>
    }
  </div>

  <button type="button" class="btn-success" (click)="addStall()">
    <app-icon name="plus" [size]="16" />
    Add Shop (then drag on grid)
  </button>
</section>
