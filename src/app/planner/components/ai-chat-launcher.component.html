@if (session.open()) {
  <section class="ai-popup" role="dialog" aria-modal="false" aria-labelledby="ai-chat-title" id="ai-chat-popup">
    <header class="ai-header">
      <app-icon name="sparkles" [size]="19" />
      <div class="ai-heading"><h2 id="ai-chat-title">AI Layout Assistant</h2><span class="hall-chip">{{ session.hall()?.name ?? 'Choose a hall' }}</span></div>
      <button type="button" class="header-action" aria-label="Minimise AI assistant" title="Minimise" (click)="close()"><app-icon name="chevron-down" [size]="17" /></button>
      <button type="button" class="header-action" aria-label="Close AI assistant" title="Close (Esc)" (click)="close()"><app-icon name="x" [size]="17" /></button>
    </header>
    <app-ai-chat inputId="ai-popup-input" />
  </section>
}
<button #launcher type="button" class="ai-launcher" title="Ask AI" aria-label="Open AI layout assistant" aria-controls="ai-chat-popup" [attr.aria-expanded]="session.open()" (click)="toggle()"><app-icon name="sparkles" [size]="24" /></button>
