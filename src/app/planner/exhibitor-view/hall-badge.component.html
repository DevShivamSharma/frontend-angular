<div class="hb" aria-hidden="true">
  <!-- The hall icon turns slowly in 3D; it holds still for people who ask for less motion. -->
  <div class="hb-icon">
    <div class="hb-spin">
      <app-icon name="building" [size]="22" />
    </div>
  </div>

  <div class="hb-name">
    @if (badge().kicker) {
      <span class="hb-kicker">{{ badge().kicker }}</span>
    }
    <span class="hb-code" [class.is-long]="badge().code.length > 5">{{ badge().code }}</span>
  </div>

  <div class="hb-meta">
    @if (badge().floor) {
      <span class="hb-floor">{{ badge().floor }}</span>
    }
    <span class="hb-available"><i></i>{{ available() }} of {{ total() }} available</span>
  </div>
</div>
