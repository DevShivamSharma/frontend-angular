<div class="notification-live" aria-live="polite" aria-atomic="true">
  @if (notify.notification(); as notification) {
    <section class="app-notification" [class.is-danger]="notification.kind === 'error'"
      [class.is-success]="notification.kind === 'success'" [class.is-paused]="notify.paused()"
      [attr.role]="notification.kind === 'error' ? 'alert' : 'status'" [attr.aria-label]="notification.title"
      (mouseenter)="notify.pause()" (mouseleave)="resume($event)"
      (focusin)="notify.pause()" (focusout)="resume($event)">
      <span class="notification-icon" aria-hidden="true">
        <app-icon [name]="notification.kind === 'error' ? 'alert' : 'check'" [size]="18" />
      </span>
      <div class="notification-body">
        <p class="notification-title">{{ notification.title }}</p>
        @if (notification.message) {
          <p class="notification-message">{{ notification.message }}</p>
        }
        @if (notification.viewDetails) {
          <button type="button" class="notification-details" (click)="notify.viewDetails()">View details</button>
        }
      </div>
      <button type="button" class="notification-close" aria-label="Dismiss notification" (click)="notify.dismiss()">
        <app-icon name="x" [size]="16" />
      </button>
      <!-- Time left before it closes by itself; stops while hovered or focused. -->
      <span class="notification-timer" aria-hidden="true" [style.animation-duration.ms]="notification.duration"></span>
    </section>
  }
</div>
