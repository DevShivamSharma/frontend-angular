<dialog
  #dialog
  class="dialog"
  [class.is-loading]="notify.dialog()?.kind === 'loading'"
  [attr.role]="notify.dialog()?.kind === 'confirm' ? 'alertdialog' : null"
  aria-labelledby="app-dialog-title"
  [attr.aria-describedby]="notify.dialog()?.kind === 'confirm' ? 'app-dialog-text' : null"
  [attr.aria-busy]="notify.dialog()?.kind === 'loading' ? true : null"
  (cancel)="onCancel($event)"
  (click)="onClick($event)"
>
  @if (notify.dialog(); as state) {
    @if (state.kind === 'confirm') {
      <div class="dialog-card">
        <div class="ad-head">
          <span class="ad-icon" [class.ad-icon--danger]="state.options.danger" aria-hidden="true">
            @if (state.options.danger) {
              <svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></svg>
            } @else {
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.5M12 17h.01" /></svg>
            }
          </span>
          <div class="ad-copy">
            <h2 id="app-dialog-title">{{ state.options.title }}</h2>
            @if (state.options.text) {
              <p id="app-dialog-text">{{ state.options.text }}</p>
            }
          </div>
        </div>
        <div class="ad-actions">
          <button #cancel type="button" class="ad-btn ad-btn--secondary" (click)="notify.answer(false)">
            {{ state.options.cancelText ?? 'Cancel' }}
          </button>
          <button type="button" class="ad-btn" [class.ad-btn--danger]="state.options.danger" (click)="notify.answer(true)">
            {{ state.options.confirmText ?? 'Confirm' }}
          </button>
        </div>
      </div>
    } @else {
      <div class="dialog-card ad-busy" role="status">
        <span class="ad-spinner" aria-hidden="true"></span>
        <p id="app-dialog-title">{{ state.title }}</p>
      </div>
    }
  }
</dialog>
