<div class="empty-state" role="status">
  <span class="empty-state__icon" aria-hidden="true">
    <i class="pi" [class]="icon()"></i>
  </span>
  <h3 role="heading" [attr.aria-level]="level()">{{ title() }}</h3>
  @if (message(); as text) {
    <p class="text-muted">{{ text }}</p>
  }
  <div class="empty-state__actions">
    <ng-content />
    @if (reload()) {
      <button type="button" class="p-button p-button-outlined" (click)="reloadPage()">
        <i class="pi pi-refresh" aria-hidden="true"></i> Reload the page
      </button>
    }
  </div>
</div>
