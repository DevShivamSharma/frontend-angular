<form [formGroup]="form" (ngSubmit)="submit()" class="layout">
  <div class="sections">
    <section formGroupName="branding">
      <h2 class="section-title">Branding</h2>
      <div class="form-grid">
        <div class="color-field">
          <input
            type="color"
            [value]="brandPreview().primaryColor"
            [disabled]="readonly()"
            (input)="pickColor('primaryColor', $event)"
            aria-label="Pick the primary colour"
          />
          <app-field
            label="Primary colour"
            hint="Every other colour is generated from it"
            error="A colour like #1f5fbf"
            for="config-form-primary-color"
          >
            <input
              id="config-form-primary-color"
              pInputText
              formControlName="primaryColor"
              placeholder="#1f5fbf"
            />
          </app-field>
        </div>
        <div class="color-field">
          <input
            type="color"
            [value]="brandPreview().accentColor ?? '#ffffff'"
            [disabled]="readonly()"
            (input)="pickColor('accentColor', $event)"
            aria-label="Pick the accent colour"
          />
          <app-field
            label="Accent colour (optional)"
            error="A colour like #e07a1f"
            for="config-form-accent-color"
          >
            <input
              id="config-form-accent-color"
              pInputText
              formControlName="accentColor"
              placeholder="#e07a1f"
            />
          </app-field>
        </div>
        <app-field label="Font" for="config-form-font">
          <p-select inputId="config-form-font" formControlName="fontFamily" [options]="fonts">
            <ng-template #selectedItem let-font>
              <span class="font-name" [style.font-family]="font">{{ font }}</span>
            </ng-template>
            <ng-template #item let-font>
              <span class="font-name" [style.font-family]="font">{{ font }}</span>
            </ng-template>
          </p-select>
        </app-field>
      </div>
      <app-field
        class="full-width"
        label="Logo URL"
        hint="https:// address, or a /path on this site"
        error="An https:// address or a /path"
        for="config-form-logo-url"
      >
        <input
          id="config-form-logo-url"
          pInputText
          formControlName="logoUrl"
          placeholder="https://…/logo.svg"
        />
      </app-field>
      <div class="form-grid">
        <app-field
          label="Logo for dark backgrounds"
          error="An https:// address or a /path"
          for="config-form-logo-dark-url"
        >
          <input id="config-form-logo-dark-url" pInputText formControlName="logoDarkUrl" />
        </app-field>
        <app-field
          label="Favicon URL"
          error="An https:// address or a /path"
          for="config-form-favicon-url"
        >
          <input id="config-form-favicon-url" pInputText formControlName="faviconUrl" />
        </app-field>
      </div>
    </section>

    <section formGroupName="locale">
      <h2 class="section-title">Language and region</h2>
      <div class="form-grid">
        <app-field
          label="Languages offered"
          for="config-form-languages"
          [error]="
            form.controls.locale.controls.languages.hasError('missingDefault')
              ? 'Include the default language'
              : 'Choose at least one'
          "
        >
          <p-multiselect
            inputId="config-form-languages"
            formControlName="languages"
            [options]="languages"
            optionLabel="label"
            optionValue="code"
            display="chip"
            [showToggleAll]="false"
          />
        </app-field>
        <app-field label="Default language" for="config-form-default-language">
          <p-select
            inputId="config-form-default-language"
            formControlName="defaultLanguage"
            [options]="languages"
            optionLabel="label"
            optionValue="code"
          />
        </app-field>
        <app-field label="Currency" for="config-form-currency">
          <p-select
            inputId="config-form-currency"
            formControlName="currency"
            [options]="currencies"
          />
        </app-field>
        <app-field label="Time zone" for="config-form-timezone">
          <p-autocomplete
            inputId="config-form-timezone"
            formControlName="timezone"
            [suggestions]="timezoneSuggestions()"
            (completeMethod)="timezoneQuery.set($event.query)"
            [dropdown]="true"
            [completeOnFocus]="true"
            appendTo="body"
          />
        </app-field>
      </div>
    </section>

    <section formGroupName="legal">
      <h2 class="section-title">Invoice details</h2>
      <div class="form-grid">
        <app-field label="Legal name" for="config-form-legal-name">
          <input id="config-form-legal-name" pInputText formControlName="legalName" />
        </app-field>
        <app-field
          label="GSTIN"
          error="15 characters, as on the GST certificate"
          for="config-form-gstin"
        >
          <input
            id="config-form-gstin"
            pInputText
            formControlName="gstin"
            placeholder="07AAACI1681G1ZN"
          />
        </app-field>
        <app-field
          label="Invoice number prefix"
          error="Up to 12 capital letters, digits, / or -"
          for="config-form-invoice-prefix"
        >
          <input
            id="config-form-invoice-prefix"
            pInputText
            formControlName="invoicePrefix"
            placeholder="ITPO-"
          />
        </app-field>
        <app-field
          label="Support email"
          error="A valid email address"
          for="config-form-support-email"
        >
          <input
            id="config-form-support-email"
            pInputText
            type="email"
            formControlName="supportEmail"
          />
        </app-field>
      </div>
      <app-field class="full-width" label="Registered address" for="config-form-address">
        <textarea id="config-form-address" pTextarea formControlName="address" rows="2"></textarea>
      </app-field>
    </section>

    <section formGroupName="email">
      <h2 class="section-title">Email</h2>
      <div class="form-grid">
        <app-field label="Sender name" for="config-form-sender-name">
          <input id="config-form-sender-name" pInputText formControlName="senderName" />
        </app-field>
        <app-field
          label="Reply-to address"
          error="A valid email address"
          for="config-form-reply-to"
        >
          <input id="config-form-reply-to" pInputText type="email" formControlName="replyTo" />
        </app-field>
      </div>
      <app-field class="full-width" label="Footer on every email" for="config-form-footer">
        <textarea id="config-form-footer" pTextarea formControlName="footer" rows="2"></textarea>
      </app-field>
    </section>

    @if (!readonly()) {
      <div class="row actions">
        <button pButton type="submit" [disabled]="saving() || form.pristine">
          {{ saving() ? 'Saving…' : 'Save as a new version' }}
        </button>
        <button
          pButton
          [text]="true"
          type="button"
          [disabled]="saving() || form.pristine"
          (click)="discard()"
        >
          Discard changes
        </button>
      </div>
    }
  </div>

  <aside class="preview-column" aria-label="Preview">
    <div #preview class="preview">
      <div class="preview-bar">
        <app-brand-mark
          [name]="organisationName()"
          [logoUrl]="brandPreview().logoUrl"
          [logoDarkUrl]="brandPreview().logoDarkUrl"
          [size]="28"
        />
      </div>
      <div class="preview-body">
        <p class="preview-title">Hall 5 · IITF 2026</p>
        <p class="muted">How pages look with these settings.</p>
        <div class="row">
          <button pButton type="button" tabindex="-1">Book a stall</button>
          <button pButton [outlined]="true" type="button" tabindex="-1">View plan</button>
        </div>
        <div class="chips" aria-hidden="true">
          <span class="chip highlighted">Available</span>
          <span class="chip">Corner</span>
        </div>
        <div class="swatches" aria-hidden="true">
          <span class="swatch primary">Primary</span>
          <span class="swatch secondary">Secondary</span>
          <span class="swatch tertiary">Accent</span>
        </div>
      </div>
    </div>
  </aside>
</form>
