<dialog #dialog class="plan-dialog" id="plan-dialog" aria-labelledby="plan-title" (click)="backdrop($event)"><div class="plan-toolbar"><strong id="plan-title">{{ detail()?.title }}</strong><button id="plan-minus" aria-label="Zoom plan out" (click)="zoomOut()">−</button><button id="plan-plus" aria-label="Zoom plan in" (click)="zoomIn()">+</button><button id="plan-fit" (click)="reset()">Fit</button><a id="plan-original" [attr.href]="detail()?.plan || null" target="_blank" rel="noopener">Original ↗</a><button id="close-plan" aria-label="Close floor plan" (click)="close()">×</button></div><div #scroll class="plan-scroll"><img #image id="large-plan" [attr.src]="detail()?.plan || null" [alt]="detail() ? detail()!.title + ' supplied floor plan' : ''" [style.width.px]="imageWidth()" style="height:auto" (load)="fit()"></div></dialog>
